name: Release

# Opens or updates the "Version Packages" PR from pending changesets. It never publishes: @schemastud
# packages release as Git release refs (a detached release commit plus a `<package>@<version>` tag, made
# by the ecosystem's tools/js-release/release-package; docs/design/js-git-release-refs.md), and consumers
# pin those commits. With `publish:` set, every push to main that left no pending changesets ran
# `changeset publish`; on 2026-10-18 (run 39164931961) it attempted to publish _resources, breadcrumb and
# combobox 0.1.0 and failed only on ENEEDAUTH after falling back to npm trusted publishing (OIDC).
# GITHUB_TOKEN is provided automatically.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
